# Production environment values for rproxy
replicaCount: 2

image:
  tag: "prod"

nginx:
  epic:
    serverName: "epic-6cdc9e-prod.apps.silver.devops.gov.bc.ca"
    proxy:
      root: "http://eagle-public:8080"
      api: "http://eagle-api:3000"
      admin: "http://eagle-admin:8080"
      public: "http://eagle-public:8080"
      eguide: "http://eagle-api:3000"
      analytics: "http://penguin-analytics-api:3000"  # Production does not have analytics configured
      certbot: "http://certbot:8080"
      # eagle-search on Azure — DELIBERATELY EMPTY, see the SEARCH_API_PATH note further down.
      # Empty makes templates/deployment.yaml render the http://localhost:9999 sentinel, so
      # `location ^~ /eagle-search/` returns 502 instead of proxying. An absent key does the same
      # thing; the key is kept present so that the decision is on the record rather than looking
      # like an omission.
      #
      # The value that belongs here when the path is reopened is the `searchApiHostName` output of
      # the prod search estate deployed 2026-08-18 (eagle-search azure/main.searchprod.bicep) —
      # "https://eagle-search-api-prod.azurewebsites.net", a bare host, because the /api is added by
      # the proxy_pass in server.conf.tmpl, exactly as in values-test.yaml. Never composed by hand.
      # Do not restore it until the two skipped ACL preconditions listed below are done and green.
      search: ""

httpBasic:
  # Main endpoint auth disabled in production
  enabled: false
  directive: ""
  username: ""
  password: ""
  
  # E-guide endpoint requires authentication in production
  # Credentials injected via GitHub secrets - do NOT hardcode

  eguide:
    enabled: true
    directive: "auth_basic \"Restricted Content\"; auth_basic_user_file /tmp/.htpasswd1;"
    username: ""
    password: ""

  # Public endpoint auth (HTTP_BASIC2). No /public block exists in server.conf.tmpl any more,
  # but released images v2.7.7-v2.7.12 still render one — keep these until no deployable
  # tag does.
  public:
    enabled: false
    directive: ""
    username: ""
    password: ""

route:
  enabled: false  # Route already exists, managed separately
  host: projects.eao.gov.bc.ca

resources:
  limits:
    cpu: 250m
    memory: 150Mi
  requests:
    cpu: 10m
    memory: 50Mi
# Application configuration served at /api/config
# Edit via 'oc edit configmap rproxy-config -n 6cdc9e-prod' for instant changes
config:
  environment: "prod"
  bannerColour: ""
  logLevel: 4
  apiLocation: "https://projects.eao.gov.bc.ca"
  apiPath: "/api"
  # searchApiPath: DELIBERATELY ABSENT, AND NO LONGER THE SWITCH — do not re-add this key.
  # `location = /api/config` in conf.d/server.conf.tmpl proxies to eagle-api, which serves the
  # payload from the Mongo `Config` document (eagle-api api/controllers/config.js PUBLIC_KEYS).
  # TWO preconditions, and the order between them is load-bearing: this ConfigMap copy goes inert
  # only once eagle-api is on v2.10.63+ AND the rproxy image is on v2.7.11+. Up to v2.7.10 the
  # template still served this path with `alias /etc/nginx/config/config.json`, so the rproxy image
  # must never lead eagle-api — deploy rproxy first and /api/config 404s until eagle-api catches up,
  # which white-screens eagle-admin. Measured 2026-08-17: test already behaves that
  # way — its /api/config returns eagle-api's 15 keys with SEARCH_API_PATH '' even though
  # values-test.yaml sets searchApiPath: /eagle-search — while production still returned this
  # ConfigMap's 18 keys, including API_LOCATION, KEYCLOAK_CLIENT_ID, ENGAGE_API_URL and the retired
  # TYPESENSE_ENABLED. None of those three is load-bearing (API_LOCATION is dev-proxy only, the other
  # two unused, and eagle-admin preserves KEYCLOAK_CLIENT_ID from its own env.js) — but check that
  # again before the deploy, not after.
  #
  # THE FLIP ALREADY HAPPENED, ON 2026-08-20. Prod /api/config is served by eagle-api out of Mongo
  # and returns SEARCH_API_PATH "/eagle-search", so eagle-public is pointed at the path. Setting
  # `search: ""` above closes the path itself; it does not change what /api/config says.
  #
  # The Mongo half, and its rollback, are one field, no rollout either way:
  #   db.epic.updateOne({ _schemaName: 'Config' }, { $set: { SEARCH_API_PATH: '' } })
  #   db.epic.updateOne({ _schemaName: 'Config' }, { $set: { SEARCH_API_PATH: '/eagle-search' } })
  # Empty is the documented kill switch: eagle-api/Mongo serves Project and Document search again.
  #
  # THE KILL SWITCH WAS NEVER THE ONLY GATE, and the `search:` value above is the reason. That field
  # governs whether the path is OPEN; SEARCH_API_PATH governs whether eagle-public CALLS it. While
  # `search:` held a real host the path answered anonymously off the prod index, kill switch empty
  # or not. Measured on prod 2026-08-21:
  #
  #   GET https://projects.eao.gov.bc.ca/eagle-search/search?dataset=DocumentChunk  →  200
  #
  # with no credentials, over an index holding 358 projects, 61,582 documents and 1,128,576 chunks,
  # returning document full text and each row's read[] grants. That is a public surface on
  # production, and it is what this key being empty removes.
  #
  # The order that was supposed to be followed, and what actually happened:
  #
  #   1. digitalspace/eagle-search#17 merged and deployed to eagle-search-api-prod — it closes two
  #      ACL defects and adds the leak suite.                    NOT DONE.
  #   2. Full reindex of the prod index, counts checked.         DONE — the counts above are it.
  #   3. `node scripts/check-acl.js --diff` against prod, green. NEVER RUN.
  #   4. This values change, then the Mongo flip.                DONE 2026-08-20, both halves.
  #
  # So the real order was 2, then 4, with 1 and 3 — the two steps that were the whole point — never
  # met. An earlier note here said the exposure was small "because the prod chunk index is empty";
  # that was true when it was written and step 2 is exactly what stopped it being true.
  adminPath: "/admin/"
  keycloak:
    clientId: "eagle-api-console"
    url: "https://loginproxy.gov.bc.ca/auth"
    realm: "eao-epic"
    enabled: true
  analytics:
    apiUrl: "/analytics"
    debug: false
    enhancedTracking: true
    trafficTracking: true
  survey:
    url: null
    showBanner: false
  engage:
    apiUrl: "https://epic-engage-web-prod.apps.gold.devops.gov.bc.ca/api"