# Production environment values for rproxy
replicaCount: 2

image:
  tag: "prod"

nginx:
  epic:
    serverName: "epic-6cdc9e-prod.apps.silver.devops.gov.bc.ca"
    proxy:
      root: "http://eagle-public:8080"
      api: "http://eagle-api:3000"
      admin: "http://eagle-admin:8080"
      public: "http://eagle-public:8080"
      eguide: "http://eagle-api:3000"
      analytics: "http://penguin-analytics-api:3000"  # Production does not have analytics configured
      certbot: "http://certbot:8080"
      # search: eagle-search on Azure. Bare host — the /api is added by the proxy_pass in
      # server.conf.tmpl, exactly as in values-test.yaml. LEFT COMMENTED because the production
      # search estate does not exist yet (eagle-search azure/main.searchprod.bicep is written but
      # unrun) and because `location ^~ /eagle-search/` with no upstream is a 502 generator. Fill in
      # the host from that deployment's `searchApiHostName` output, never compose it.
      # search: "https://eagle-search-api-prod.azurewebsites.net"

httpBasic:
  # Main endpoint auth disabled in production
  enabled: false
  directive: ""
  username: ""
  password: ""
  
  # E-guide endpoint requires authentication in production
  # Credentials injected via GitHub secrets - do NOT hardcode
  eguide:
    enabled: true
    directive: "auth_basic \"Restricted Content\"; auth_basic_user_file /tmp/.htpasswd1;"
    username: ""
    password: ""
  
  # Public endpoint auth disabled in production
  public:
    enabled: false
    directive: ""
    username: ""
    password: ""

route:
  enabled: false  # Route already exists, managed separately
  host: projects.eao.gov.bc.ca

resources:
  limits:
    cpu: 250m
    memory: 150Mi
  requests:
    cpu: 10m
    memory: 50Mi
# Application configuration served at /api/config
# Edit via 'oc edit configmap rproxy-config -n 6cdc9e-prod' for instant changes
config:
  environment: "prod"
  bannerColour: ""
  logLevel: 4
  apiLocation: "https://projects.eao.gov.bc.ca"
  apiPath: "/api"
  # searchApiPath: the switch that moves Project and Document search off eagle-api/Mongo and onto
  # eagle-search (Azure AI Search). Absent — as it is now — templates/configmap.yaml emits an empty
  # SEARCH_API_PATH and the public bundle keeps asking eagle-api, which is the documented kill
  # switch and today's production behaviour.
  #
  # BUT THIS VALUE ONLY REACHES THE BROWSER WHILE PRODUCTION RUNS THE OLD IMAGE, and that is not a
  # detail — it changes which switch to throw. `location = /api/config` in conf.d/server.conf.tmpl
  # proxies to eagle-api, which serves the payload from the Mongo `Config` document
  # (eagle-api api/controllers/config.js PUBLIC_KEYS). Measured 2026-08-17: test already behaves that
  # way — its /api/config returns exactly eagle-api's 15 keys and SEARCH_API_PATH '', even though
  # values-test.yaml sets searchApiPath: /eagle-search — while production still returns this
  # ConfigMap's 18 keys, including API_LOCATION, KEYCLOAK_CLIENT_ID, ENGAGE_API_URL and the retired
  # TYPESENSE_ENABLED, none of which eagle-api serves.
  #
  # So: deploying this chart to production moves the config source from here to the database. The
  # search switch then lives in the prod `Config` document, not in this file, and the three extra
  # keys above stop being served. None of them is load-bearing for eagle-public (API_LOCATION is
  # dev-proxy only, the other two unused) and eagle-admin preserves KEYCLOAK_CLIENT_ID from its own
  # env.js by design — but that is worth checking again before the deploy, not discovering after.
  #
  # DO NOT UNCOMMENT UNTIL ALL THREE ARE TRUE, in this order:
  #   1. the prod search estate is deployed (eagle-search azure/main.searchprod.bicep),
  #   2. the sync worker has run a FULL reindex against production Mongo and the counts have been
  #      checked — an empty index answers every query with zero results, which is indistinguishable
  #      from a working search that found nothing,
  #   3. `proxy.search` above is filled in.
  # Rollback is this line and that one going back to commented, or `oc edit configmap rproxy-config`
  # to blank SEARCH_API_PATH; clients revert on their next load.
  # searchApiPath: "/eagle-search"
  adminPath: "/admin/"
  keycloak:
    clientId: "eagle-api-console"
    url: "https://loginproxy.gov.bc.ca/auth"
    realm: "eao-epic"
    enabled: true
  analytics:
    apiUrl: "/analytics"
    debug: false
    enhancedTracking: true
    trafficTracking: true
  survey:
    url: null
    showBanner: false
  engage:
    apiUrl: "https://epic-engage-web-prod.apps.gold.devops.gov.bc.ca/api"