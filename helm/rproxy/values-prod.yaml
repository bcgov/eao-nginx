# Production environment values for rproxy
replicaCount: 2

image:
  tag: "prod"

nginx:
  epic:
    serverName: "epic-6cdc9e-prod.apps.silver.devops.gov.bc.ca"
    proxy:
      root: "http://eagle-public:8080"
      api: "http://eagle-api:3000"
      admin: "http://eagle-admin:8080"
      public: "http://eagle-public:8080"
      eguide: "http://eagle-api:3000"
      analytics: "http://penguin-analytics-api:3000"  # Production does not have analytics configured
      certbot: "http://certbot:8080"
      # eagle-search on Azure. Bare host — the /api is added by the proxy_pass in
      # server.conf.tmpl, exactly as in values-test.yaml. Host is the `searchApiHostName` output of
      # the prod search estate deployed 2026-08-18 (eagle-search azure/main.searchprod.bicep), never
      # composed by hand. Without it templates/deployment.yaml renders the http://localhost:9999
      # sentinel and `location ^~ /eagle-search/` 502s.
      search: "https://eagle-search-api-prod.azurewebsites.net"

httpBasic:
  # Main endpoint auth disabled in production
  enabled: false
  directive: ""
  username: ""
  password: ""
  
  # E-guide endpoint requires authentication in production
  # Credentials injected via GitHub secrets - do NOT hardcode

  eguide:
    enabled: true
    directive: "auth_basic \"Restricted Content\"; auth_basic_user_file /tmp/.htpasswd1;"
    username: ""
    password: ""

  # Public endpoint auth (HTTP_BASIC2). No /public block exists in server.conf.tmpl any more,
  # but released images v2.7.7-v2.7.12 still render one — keep these until no deployable
  # tag does.
  public:
    enabled: false
    directive: ""
    username: ""
    password: ""

route:
  enabled: false  # Route already exists, managed separately
  host: projects.eao.gov.bc.ca

resources:
  limits:
    cpu: 250m
    memory: 150Mi
  requests:
    cpu: 10m
    memory: 50Mi
# Application configuration served at /api/config
# Edit via 'oc edit configmap rproxy-config -n 6cdc9e-prod' for instant changes
config:
  environment: "prod"
  bannerColour: ""
  logLevel: 4
  apiLocation: "https://projects.eao.gov.bc.ca"
  apiPath: "/api"
  # searchApiPath: DELIBERATELY ABSENT, AND NO LONGER THE SWITCH — do not re-add this key.
  # `location = /api/config` in conf.d/server.conf.tmpl proxies to eagle-api, which serves the
  # payload from the Mongo `Config` document (eagle-api api/controllers/config.js PUBLIC_KEYS).
  # TWO preconditions, and the order between them is load-bearing: this ConfigMap copy goes inert
  # only once eagle-api is on v2.10.63+ AND the rproxy image is on v2.7.11+. Up to v2.7.10 the
  # template still served this path with `alias /etc/nginx/config/config.json`, so the rproxy image
  # must never lead eagle-api — deploy rproxy first and /api/config 404s until eagle-api catches up,
  # which white-screens eagle-admin.
  #
  # THAT WARNING IS NOW HISTORICAL, BOTH CONDITIONS SATISFIED. It is kept because it is the reason
  # the sequencing was safe, and because it binds again in reverse: any rollback that takes the
  # rproxy image below v2.7.11 needs /api/config to come back to this file with it. As of
  # 2026-08-21 prod eagle-api is v2.10.65 and prod rproxy is v2.7.12; the /api/config move landed in
  # rproxy v2.7.11 and prod crossed it on 2026-08-20.
  #
  # The measurement recorded here was taken on 2026-08-17 and has since been overtaken. It said test
  # already served eagle-api's 15 keys "while production still returned this ConfigMap's 18 keys".
  # The first half still holds; the second stopped being true on 2026-08-20. Re-measured 2026-08-21,
  # prod /api/config returns eagle-api's 15 keys with SEARCH_API_PATH '/eagle-search'.
  #
  # THE ARITHMETIC, because the key sets are easy to state wrongly. The 18-key payload prod served
  # until 2026-08-20 was the v2.7.10 ConfigMap. Four of its keys are absent from what eagle-api
  # returns: API_LOCATION, KEYCLOAK_CLIENT_ID, TYPESENSE_ENABLED and ENGAGE_API_URL. eagle-api adds
  # SEARCH_API_PATH. 18 - 4 + 1 = 15.
  #
  # Do not read that four-key list as a description of THIS chart: TYPESENSE_ENABLED left
  # configmap.yaml in v2.7.11 (81843b3, "drop the typesense proxy and config"), so the ConfigMap
  # rendered here carries 18 keys including SEARCH_API_PATH and NOT TYPESENSE_ENABLED. Grep this
  # chart for the four and you will find three.
  #
  # None of the four is load-bearing — API_LOCATION is dev-proxy only, TYPESENSE_ENABLED is retired,
  # ENGAGE_API_URL is unused, and eagle-admin preserves KEYCLOAK_CLIENT_ID from its own env.js — and
  # prod has run without them since 2026-08-20 with no breakage. So every key in this block is now
  # rendered, mounted and read by nobody.
  #
  # The flip and its rollback are one Mongo field, no rollout either way:
  #   db.epic.updateOne({ _schemaName: 'Config' }, { $set: { SEARCH_API_PATH: '/eagle-search' } })
  #   db.epic.updateOne({ _schemaName: 'Config' }, { $set: { SEARCH_API_PATH: '' } })
  # Empty is the documented kill switch: eagle-api/Mongo serves Project and Document search again.
  #
  # BUT THE KILL SWITCH IS NOT THE ONLY GATE, and the `search:` value above is the reason. That
  # field governs whether eagle-public CALLS /eagle-search/; it does not govern whether the path is
  # OPEN. The moment this renders, `projects.eao.gov.bc.ca/eagle-search/search?dataset=Document`
  # answers anonymously off the prod index, kill switch empty or not. That is a new public surface
  # on production, so the order is:
  #
  #   1. digitalspace/eagle-search#17 merged and deployed to eagle-search-api-prod — it closes two
  #      ACL defects and adds the leak suite.
  #   2. Full reindex of the prod index, counts checked.
  #   3. `node scripts/check-acl.js --diff` against prod, green.
  #   4. This values change, then the Mongo flip.
  #
  # Steps 2 and 4 were already here; 1 and 3 are the ones that matter because THIS file is what
  # makes the path reachable. The exposure is small today only because the prod chunk index is empty
  # — and the reindex in step 2 is exactly what fills it.
  adminPath: "/admin/"
  keycloak:
    clientId: "eagle-api-console"
    url: "https://loginproxy.gov.bc.ca/auth"
    realm: "eao-epic"
    enabled: true
  analytics:
    apiUrl: "/analytics"
    debug: false
    enhancedTracking: true
    trafficTracking: true
  survey:
    url: null
    showBanner: false
  engage:
    apiUrl: "https://epic-engage-web-prod.apps.gold.devops.gov.bc.ca/api"