replicaCount: 0 # rproxy retired; keep 0

image:
  tag: "prod"

nginx:
  epic:
    serverName: "epic-6cdc9e-prod.apps.silver.devops.gov.bc.ca"
    proxy:
      # Front Door endpoint: read it back from Azure, never compose it. Azure picks the zone (a01);
      # a wrong one still resolves and 404s every page while the probes stay green.
      root: "https://eagle-public-prod-aafug4ahavgzbvh9.a01.azurefd.net"  # no trailing slash or path
      api: "http://eagle-api:3000"
      admin: "http://eagle-admin:8080"
      public: "http://eagle-public:8080"
      eguide: "http://eagle-api:3000"
      # Bare host: each /analytics location adds its own path.
      analytics: "https://demi-apim-prod.azure-api.net"
      certbot: "http://certbot:8080"
      # No search key: search goes to demi-api via /demi-search. Bare host: each location adds
      # its own /api/... path.
      demi: "https://demi-apim-prod.azure-api.net"

httpBasic:
  enabled: false
  directive: ""
  username: ""
  password: ""
  
  # Set from GitHub secrets at deploy time; never commit a value.
  eguide:
    enabled: true
    directive: "auth_basic \"Restricted Content\"; auth_basic_user_file /tmp/.htpasswd1;"
    username: ""
    password: ""

  # HTTP_BASIC2: older tags still render /public; see values.yaml.
  public:
    enabled: false
    directive: ""
    username: ""
    password: ""

route:
  enabled: false  # Route already exists, managed separately
  host: projects.eao.gov.bc.ca

resources:
  limits:
    cpu: 250m
    memory: 150Mi
  requests:
    cpu: 10m
    memory: 50Mi
# Inert on v2.7.11+ images: eagle-api serves /api/config. Kept for a rollback below v2.7.11;
# see values-test.yaml.
config:
  environment: "prod"
  bannerColour: ""
  logLevel: 4
  apiLocation: "https://projects.eao.gov.bc.ca"
  apiPath: "/api"
  # searchApiPath stays absent: the live value is SEARCH_API_PATH in eagle-api's Mongo Config.
  adminPath: "/admin/"
  keycloak:
    clientId: "eagle-api-console"
    url: "https://loginproxy.gov.bc.ca/auth"
    realm: "eao-epic"
    enabled: true
  survey:
    url: null
    showBanner: false
  engage:
    apiUrl: "https://epic-engage-web-prod.apps.gold.devops.gov.bc.ca/api"