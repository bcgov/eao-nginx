apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rproxy.fullname" . }}
  labels:
    {{- include "rproxy.labels" . | nindent 4 }}
  annotations:
    # Trigger automatic rollout when ImageStreamTag is updated
    image.openshift.io/triggers: |
      [{"from":{"kind":"ImageStreamTag","name":"{{ .Values.image.name }}:{{ .Values.image.tag }}","namespace":"{{ .Values.image.namespace }}"},"fieldPath":"spec.template.spec.containers[?(@.name==\"rproxy\")].image"}]
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "rproxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when a credential is rotated; the env comes from a Secret, and a Secret
        # change on its own does not restart anything.
        checksum/basic-auth: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "rproxy.selectorLabels" . | nindent 8 }}
        role: {{ .Values.podLabels.role | default "rproxy-eagle-epic" }}
        app: {{ .Values.podLabels.app | default "eagle-epic" }}
    spec:
      containers:
        - name: rproxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            # HTTP Basic Auth configuration. The directives are plain values; the credentials come
            # from the rproxy-basic-auth Secret so `get deploy` does not expose them.
            - name: HTTP_BASIC
              value: {{ ternary .Values.httpBasic.directive "" .Values.httpBasic.enabled | quote }}
            - name: USERNAME
              valueFrom:
                secretKeyRef:
                  name: rproxy-basic-auth
                  key: username
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rproxy-basic-auth
                  key: password
            - name: HTTP_BASIC1
              value: {{ .Values.httpBasic.eguide.directive | quote }}
            - name: USERNAME1
              valueFrom:
                secretKeyRef:
                  name: rproxy-basic-auth
                  key: eguide-username
            - name: PASSWORD1
              valueFrom:
                secretKeyRef:
                  name: rproxy-basic-auth
                  key: eguide-password
            # Unused by server.conf.tmpl, but tags up to v2.7.12 expand them and an unset variable
            # breaks nginx; pr.yaml's guard keeps every variable a tag >= MIN_TAG expands.
            - name: HTTP_BASIC2
              value: {{ .Values.httpBasic.public.directive | quote }}
            - name: USERNAME2
              valueFrom:
                secretKeyRef:
                  name: rproxy-basic-auth
                  key: public-username
            - name: PASSWORD2
              valueFrom:
                secretKeyRef:
                  name: rproxy-basic-auth
                  key: public-password
            - name: NGINX__AJAX__SERVER_NAME
              value: {{ .Values.nginx.ajax.serverName | quote }}
            - name: NGINX__AJAX__REDIRECT
              value: {{ .Values.nginx.ajax.redirect | quote }}
            - name: NGINX__EPIC__SERVER_NAME
              value: {{ .Values.nginx.epic.serverName | quote }}
            - name: NGINX__EPIC__PROXY__ROOT
              value: {{ .Values.nginx.epic.proxy.root | quote }}
            - name: NGINX__EPIC__PROXY__API
              value: {{ .Values.nginx.epic.proxy.api | quote }}
            - name: NGINX__EPIC__PROXY__ADMIN
              value: {{ .Values.nginx.epic.proxy.admin | quote }}
            # Kept like HTTP_BASIC2: released tags still expand it.
            - name: NGINX__EPIC__PROXY__PUBLIC
              value: {{ .Values.nginx.epic.proxy.public | quote }}
            - name: NGINX__EPIC__PROXY__EGUIDE
              value: {{ .Values.nginx.epic.proxy.eguide | quote }}
            # Sentinel default, same reason as SEARCH below.
            - name: NGINX__EPIC__PROXY__ANALYTICS
              value: {{ .Values.nginx.epic.proxy.analytics | default "http://localhost:9999" | quote }}
            # Kept like HTTP_BASIC2, with no values key: tags v2.7.31 and v2.7.32 expand it, and an
            # unset value renders `proxy_pass ;`.
            - name: NGINX__EPIC__PROXY__ANALYTICS_LEGACY
              value: "http://localhost:9999"
            - name: NGINX__EPIC__PROXY__CERTBOT
              value: {{ .Values.nginx.epic.proxy.certbot | quote }}
            # Sentinel default: an empty value renders `proxy_pass ;`, an [emerg] that stops the whole
            # proxy. An unreachable port gives a 502 instead of a CrashLoopBackOff.
            - name: NGINX__EPIC__PROXY__SEARCH
              value: {{ .Values.nginx.epic.proxy.search | default "http://localhost:9999" | quote }}
            # demi-api for /demi-search, /s/ and /demi-projects; sentinel default as for SEARCH.
            - name: NGINX__EPIC__PROXY__DEMI
              value: {{ .Values.nginx.epic.proxy.demi | default "http://localhost:9999" | quote }}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "rproxy.fullname" . }}-config
            items:
              - key: config.json
                path: config.json
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
