apiVersion: v1
kind: Secret
metadata:
  name: rproxy-basic-auth
  labels:
    {{- include "rproxy.labels" . | nindent 4 }}
type: Opaque
# All six keys render unconditionally, empty value included: secretKeyRef fails a pod on a
# MISSING key, not on an empty one, and every environment leaves at least one pair unset.
stringData:
  username: {{ .Values.httpBasic.username | quote }}
  password: {{ .Values.httpBasic.password | quote }}
  eguide-username: {{ .Values.httpBasic.eguide.username | quote }}
  eguide-password: {{ .Values.httpBasic.eguide.password | quote }}
  public-username: {{ .Values.httpBasic.public.username | quote }}
  public-password: {{ .Values.httpBasic.public.password | quote }}
