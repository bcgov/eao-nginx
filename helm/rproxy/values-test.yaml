# Test environment values for rproxy
replicaCount: 2

image:
  tag: "test"

nginx:
  epic:
    serverName: "epic-6cdc9e-test.apps.silver.devops.gov.bc.ca test.projects.eao.gov.bc.ca"
    proxy:
      # AZURE HOSTING, mirroring prod since eao-nginx v2.7.14. The Angular bundle is served from
      # Storage `$web` behind Front Door; rproxy stays the edge, so `/api`, `/admin/`, `/analytics`,
      # `/eguide` and `/demi-search/search` remain its own locations and the app
      # stays same-origin. Published by eagle-public's `Deploy eagle-public to Azure staging`
      # workflow, which must run for the SAME TAG as `Deploy to Test` or the two platforms serve
      # different builds behind one hostname.
      #
      # READ THIS HOSTNAME OFF THE DEPLOYMENT, never compose it: Azure assigns both the hash and the
      # zone (`a02` here, not the documented `z01`), and a wrong zone still resolves — it returns 404
      # on every page while `/nginx_status` and the readiness probe stay green.
      #
      # Rollback is `oc set env deploy/rproxy NGINX__EPIC__PROXY__ROOT=http://eagle-public:8080
      # -n 6cdc9e-test`, which is why deploy/eagle-public stays running with endpoints.
      root: "https://eagle-public-test-dbg8ghh8gjd0bscx.a02.azurefd.net"
      api: "http://eagle-api:3000"
      admin: "http://eagle-admin:8080"
      public: "http://eagle-public:8080"
      eguide: "http://eagle-api:3000"
      analytics: "http://penguin-analytics-api:3000"
      certbot: "http://certbot:8080"
      # No eagle-search route: eagle-search-api-test retired 2026-08-25; test search is demi-api
      # via /demi-search. The deployment renders the sentinel, as in dev.
      # demi-api on Azure. INTERIM, delete with `location = /demi-search/search` once
      # demi.eao.gov.bc.ca resolves. Bare host: the /api/search is added by the proxy_pass.
      demi: "https://demi-apim-test.azure-api.net"

httpBasic:
  enabled: false  # replaced by the ACCESS_GATE curtain in eagle-public and eagle-admin
  directive: "auth_basic \"Restricted Content\"; auth_basic_user_file /tmp/.htpasswd;"
  # Credentials injected via GitHub secrets - do NOT hardcode
  username: ""
  password: ""
  

  eguide:
    enabled: false
    directive: ""
    username: ""
    password: ""

  # Public endpoint auth (HTTP_BASIC2). No /public block exists in server.conf.tmpl any more,
  # but released images v2.7.7-v2.7.12 still render one — keep these until no deployable
  # tag does.
  public:
    enabled: true
    directive: "auth_basic \"Restricted Content\"; auth_basic_user_file /tmp/.htpasswd2;"
    username: ""
    password: ""

# Test-specific server block configuration
nginxTest:
  serverName: "test.projects.eao.gov.bc.ca"
  proxy:
    root: "http://eagle-public:8080"
    api: "http://eagle-api:3000"
    admin: "http://eagle-admin:8080"
    public: "http://eagle-public:8080"
    analytics: "http://penguin-analytics-api:3000"

route:
  enabled: false  # Route already exists, managed separately
  host: eagle-test.apps.silver.devops.gov.bc.ca

resources:
  limits:
    cpu: 250m
    memory: 150Mi
  requests:
    cpu: 30m
    memory: 25Mi

# Application configuration served at /api/config — INERT ON THIS CHART VERSION, kept for rollback.
#
# Nothing in conf.d/ or nginx.conf reads config.json any more. It is rendered by
# templates/configmap.yaml and mounted by templates/deployment.yaml, and then never served: from
# rproxy v2.7.11 `location = /api/config` proxies to eagle-api, which answers from Mongo. So on the
# image test runs, EVERY key below is dead, not just the absent searchApiPath.
#
# PROD IS NO LONGER THE EXCEPTION. That was written when prod ran v2.7.10, whose baked-in template
# still served the mounted file, which made values-prod.yaml's copy load-bearing. Prod has run
# v2.7.12 since 2026-08-20 and the /api/config move landed in v2.7.11, so that copy is inert too and
# no environment reads config.json any more.
#
# The block stays for a different reason now: ROLLBACK. Every released tag up to v2.7.10 bakes a
# template that serves the mounted file, so deleting this — and the volume, the mount and
# configmap.yaml — would make a rollback that far 404 /api/config and white-screen eagle-admin. The
# templates are shared, so it cannot be deleted for one environment only either. Delete it once no
# deployable tag is below v2.7.11, not before.
config:
  environment: "test"
  bannerColour: "orange"
  logLevel: 0
  apiLocation: "https://eagle-test.apps.silver.devops.gov.bc.ca"
  apiPath: "/api"
  # searchApiPath: DELIBERATELY ABSENT, as in values-prod.yaml — do not re-add it.
  #
  # From eagle-api v2.10.63 and rproxy v2.7.11, `location = /api/config` proxies to eagle-api
  # (conf.d/server.conf.tmpl), which serves the payload from the Mongo `Config` document. Both
  # preconditions have held in test since 2026-08-17, so this key reached nobody: the ConfigMap said
  # "/eagle-search" while /api/config served eagle-api's own keys, and for weeks the live value there
  # was "" — test search fell back to eagle-api's Mongo search with this file claiming otherwise.
  # It has since been set: as of 2026-08-19 test's /api/config returns SEARCH_API_PATH
  # "/eagle-search". Neither value was ever this file's to state.
  #
  # The live switch and its rollback are one Mongo field, no rollout either way:
  #   db.epic.updateOne({ _schemaName: 'Config' }, { $set: { SEARCH_API_PATH: '/eagle-search' } })
  #   db.epic.updateOne({ _schemaName: 'Config' }, { $set: { SEARCH_API_PATH: '' } })
  adminPath: "/admin/"
  keycloak:
    clientId: "eagle-api-console"
    url: "https://test.loginproxy.gov.bc.ca/auth"
    realm: "eao-epic"
    enabled: true
  analytics:
    apiUrl: "/analytics"
    debug: true
    enhancedTracking: true
    trafficTracking: true
  survey:
    url: null
    showBanner: false
  engage:
    apiUrl: "https://epic-engage-web-test.apps.gold.devops.gov.bc.ca/api"
