# Test environment values for rproxy
replicaCount: 2

image:
  tag: "test"

nginx:
  epic:
    serverName: "epic-6cdc9e-test.apps.silver.devops.gov.bc.ca test.projects.eao.gov.bc.ca"
    proxy:
      root: "http://eagle-public:8080"
      api: "http://eagle-api:3000"
      admin: "http://eagle-admin:8080"
      public: "http://eagle-public:8080"
      eguide: "http://eagle-api:3000"
      analytics: "http://penguin-analytics-api:3000"
      certbot: "http://certbot:8080"
      # eagle-search on Azure. Bare host: the /api is added by the proxy_pass in server.conf.tmpl.
      search: "https://eagle-search-api-test.azurewebsites.net"

httpBasic:
  enabled: true
  directive: "auth_basic \"Restricted Content\"; auth_basic_user_file /tmp/.htpasswd;"
  # Credentials injected via GitHub secrets - do NOT hardcode
  username: ""
  password: ""
  

  eguide:
    enabled: false
    directive: ""
    username: ""
    password: ""

  # Public endpoint auth (HTTP_BASIC2). No /public block exists in server.conf.tmpl any more,
  # but released images v2.7.7-v2.7.12 still render one — keep these until no deployable
  # tag does.
  public:
    enabled: true
    directive: "auth_basic \"Restricted Content\"; auth_basic_user_file /tmp/.htpasswd2;"
    username: ""
    password: ""

# Test-specific server block configuration
nginxTest:
  serverName: "test.projects.eao.gov.bc.ca"
  proxy:
    root: "http://eagle-public:8080"
    api: "http://eagle-api:3000"
    admin: "http://eagle-admin:8080"
    public: "http://eagle-public:8080"
    analytics: "http://penguin-analytics-api:3000"

route:
  enabled: false  # Route already exists, managed separately
  host: eagle-test.apps.silver.devops.gov.bc.ca

resources:
  limits:
    cpu: 50m
    memory: 50Mi
  requests:
    cpu: 30m
    memory: 25Mi

# Application configuration served at /api/config — INERT ON THIS CHART VERSION, kept for prod.
#
# Nothing in conf.d/ or nginx.conf reads config.json any more. It is rendered by
# templates/configmap.yaml and mounted by templates/deployment.yaml, and then never served: from
# rproxy v2.7.11 `location = /api/config` proxies to eagle-api, which answers from Mongo. So on the
# image test runs, EVERY key below is dead, not just the absent searchApiPath.
#
# The block stays because PROD IS THE EXCEPTION: prod runs v2.7.10, whose baked-in template still
# serves the mounted file, so values-prod.yaml's copy is load-bearing until prod moves to v2.7.11+.
# The templates are shared, so the block cannot be deleted for one environment only. Delete it —
# and the volume, the mount and configmap.yaml — once prod is upgraded, not before.
config:
  environment: "test"
  bannerColour: "orange"
  logLevel: 0
  apiLocation: "https://eagle-test.apps.silver.devops.gov.bc.ca"
  apiPath: "/api"
  # searchApiPath: DELIBERATELY ABSENT, as in values-prod.yaml — do not re-add it.
  #
  # From eagle-api v2.10.63 and rproxy v2.7.11, `location = /api/config` proxies to eagle-api
  # (conf.d/server.conf.tmpl), which serves the payload from the Mongo `Config` document. Both
  # preconditions have held in test since 2026-08-17, so this key reached nobody: the ConfigMap said
  # "/eagle-search" while /api/config served eagle-api's own keys, and for weeks the live value there
  # was "" — test search fell back to eagle-api's Mongo search with this file claiming otherwise.
  # It has since been set: as of 2026-08-19 test's /api/config returns SEARCH_API_PATH
  # "/eagle-search". Neither value was ever this file's to state.
  #
  # The live switch and its rollback are one Mongo field, no rollout either way:
  #   db.epic.updateOne({ _schemaName: 'Config' }, { $set: { SEARCH_API_PATH: '/eagle-search' } })
  #   db.epic.updateOne({ _schemaName: 'Config' }, { $set: { SEARCH_API_PATH: '' } })
  adminPath: "/admin/"
  keycloak:
    clientId: "eagle-api-console"
    url: "https://test.loginproxy.gov.bc.ca/auth"
    realm: "eao-epic"
    enabled: true
  analytics:
    apiUrl: "/analytics"
    debug: true
    enhancedTracking: true
    trafficTracking: true
  survey:
    url: null
    showBanner: false
  engage:
    apiUrl: "https://epic-engage-web-test.apps.gold.devops.gov.bc.ca/api"
