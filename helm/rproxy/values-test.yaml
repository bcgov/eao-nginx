replicaCount: 0 # rproxy retired; keep 0

image:
  tag: "test"

nginx:
  epic:
    serverName: "epic-6cdc9e-test.apps.silver.devops.gov.bc.ca test.projects.eao.gov.bc.ca"
    proxy:
      # Front Door endpoint: read it back from Azure, never compose it. Azure picks the zone (a02);
      # a wrong one still resolves and 404s every page while the probes stay green.
      root: "https://eagle-public-test-dbg8ghh8gjd0bscx.a02.azurefd.net"
      api: "http://eagle-api:3000"
      admin: "http://eagle-admin:8080"
      public: "http://eagle-public:8080"
      eguide: "http://eagle-api:3000"
      # Bare host: each /analytics location adds its own path.
      analytics: "https://demi-apim-test.azure-api.net"
      certbot: "http://certbot:8080"
      # No search key: search goes to demi-api via /demi-search. Bare host: each location adds
      # its own /api/... path.
      demi: "https://demi-apim-test.azure-api.net"

httpBasic:
  enabled: false  # replaced by the ACCESS_GATE curtain in eagle-public and eagle-admin
  directive: "auth_basic \"Restricted Content\"; auth_basic_user_file /tmp/.htpasswd;"
  # Set from GitHub secrets at deploy time; never commit a value.
  username: ""
  password: ""
  

  eguide:
    enabled: false
    directive: ""
    username: ""
    password: ""

  # HTTP_BASIC2: older tags still render /public; see values.yaml.
  public:
    enabled: true
    directive: "auth_basic \"Restricted Content\"; auth_basic_user_file /tmp/.htpasswd2;"
    username: ""
    password: ""

route:
  enabled: false  # test has no Route to rproxy
  host: eagle-test.apps.silver.devops.gov.bc.ca

resources:
  limits:
    cpu: 250m
    memory: 150Mi
  requests:
    cpu: 30m
    memory: 25Mi

# Inert on v2.7.11+ images (see values.yaml). The block, volume and configmap.yaml stay so a
# rollback below v2.7.11 still serves /api/config; the templates are shared, so all envs keep it.
config:
  environment: "test"
  bannerColour: "orange"
  logLevel: 0
  apiLocation: "https://eagle-test.apps.silver.devops.gov.bc.ca"
  apiPath: "/api"
  # searchApiPath stays absent: the live value is SEARCH_API_PATH in eagle-api's Mongo Config.
  adminPath: "/admin/"
  keycloak:
    clientId: "eagle-api-console"
    url: "https://test.loginproxy.gov.bc.ca/auth"
    realm: "eao-epic"
    enabled: true
  survey:
    url: null
    showBanner: false
  engage:
    apiUrl: "https://epic-engage-web-test.apps.gold.devops.gov.bc.ca/api"
