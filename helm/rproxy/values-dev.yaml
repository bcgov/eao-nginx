# Development environment values for rproxy
replicaCount: 1

image:
  tag: "dev"

nginx:
  epic:
    serverName: "eagle-dev.apps.silver.devops.gov.bc.ca"
    proxy:
      root: "http://eagle-public:8080"
      api: "http://eagle-api:3000"
      admin: "http://eagle-admin:8080"
      public: "http://eagle-public:8080"
      eguide: "http://eagle-api:3000"
      analytics: "http://penguin-analytics-api:3000"
      certbot: "http://certbot:8080"
      # No eagle-search route: the Azure dev estate was torn down 2026-08-11 (staging lives in
      # c4b0a8-test). Dev clients fall back to eagle-api for search — the documented rollback.

httpBasic:
  enabled: true
  directive: "auth_basic \"Restricted Content\"; auth_basic_user_file /tmp/.htpasswd;"
  # Credentials injected via GitHub secrets - do NOT hardcode
  username: ""
  password: ""
  

  eguide:
    enabled: false
    directive: ""
    username: ""
    password: ""

  # Public endpoint auth (HTTP_BASIC2). No /public block exists in server.conf.tmpl any more,
  # but released images v2.7.7-v2.7.12 still render one — keep these until no deployable
  # tag does.
  public:
    enabled: true
    directive: "auth_basic \"Restricted Content\"; auth_basic_user_file /tmp/.htpasswd2;"
    username: ""
    password: ""

route:
  enabled: false  # Route is managed by eagle-api chart, matching test and prod
  host: eagle-dev.apps.silver.devops.gov.bc.ca

resources:
  limits:
    cpu: 50m
    memory: 50Mi
  requests:
    cpu: 30m
    memory: 25Mi

# Application configuration served at /api/config
config:
  environment: "dev"
  bannerColour: "red"
  logLevel: 0
  apiLocation: "https://eagle-dev.apps.silver.devops.gov.bc.ca"
  apiPath: "/api"
  # searchApiPath deliberately absent: empty means eagle-api serves Project/Document/
  # DocumentChunk search. The Azure dev search service is gone (2026-08-11 teardown).
  adminPath: "/admin/"
  keycloak:
    clientId: "eagle-api-console"
    url: "https://dev.loginproxy.gov.bc.ca/auth"
    realm: "eao-epic"
    enabled: true
  analytics:
    apiUrl: "/analytics"
    debug: true
    enhancedTracking: true
    trafficTracking: true
  survey:
    url: null
    showBanner: false
  engage:
    apiUrl: "https://epic-engage-web-dev.apps.gold.devops.gov.bc.ca/api"
