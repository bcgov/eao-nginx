replicaCount: 1

image:
  tag: "dev"

nginx:
  epic:
    serverName: "eagle-dev.apps.silver.devops.gov.bc.ca"
    proxy:
      # No dev Front Door or eagle-public Service: dev serves the test static site.
      root: "https://eagle-public-test-dbg8ghh8gjd0bscx.a02.azurefd.net"
      api: "http://eagle-api:3000"
      admin: "http://eagle-admin:8080"
      public: "http://eagle-public:8080"
      eguide: "http://eagle-api:3000"
      # Test APIM (there is no dev APIM). Bare host: each /analytics location adds its own path.
      analytics: "https://demi-apim-test.azure-api.net"
      certbot: "http://certbot:8080"
      # No search or demi key: those locations get the deployment's sentinel and return 502.

httpBasic:
  enabled: false  # replaced by the ACCESS_GATE curtain in eagle-public and eagle-admin
  directive: "auth_basic \"Restricted Content\"; auth_basic_user_file /tmp/.htpasswd;"
  # Set from GitHub secrets at deploy time; never commit a value.
  username: ""
  password: ""
  

  eguide:
    enabled: false
    directive: ""
    username: ""
    password: ""

  # HTTP_BASIC2: older tags still render /public; see values.yaml.
  public:
    enabled: true
    directive: "auth_basic \"Restricted Content\"; auth_basic_user_file /tmp/.htpasswd2;"
    username: ""
    password: ""

route:
  enabled: false  # the dev Route to rproxy belongs to the eagle-public Helm release
  host: eagle-dev.apps.silver.devops.gov.bc.ca

resources:
  limits:
    cpu: 50m
    memory: 50Mi
  requests:
    cpu: 30m
    memory: 25Mi

config:
  environment: "dev"
  bannerColour: "red"
  logLevel: 0
  apiLocation: "https://eagle-dev.apps.silver.devops.gov.bc.ca"
  apiPath: "/api"
  # searchApiPath stays absent, as in test and prod.
  adminPath: "/admin/"
  keycloak:
    clientId: "eagle-api-console"
    url: "https://dev.loginproxy.gov.bc.ca/auth"
    realm: "eao-epic"
    enabled: true
  survey:
    url: null
    showBanner: false
  engage:
    apiUrl: "https://epic-engage-web-dev.apps.gold.devops.gov.bc.ca/api"
