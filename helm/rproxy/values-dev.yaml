# Development environment values for rproxy
replicaCount: 1

image:
  tag: "dev"

nginx:
  epic:
    serverName: "eagle-dev.apps.silver.devops.gov.bc.ca"
    proxy:
      root: "http://eagle-public:8080"
      api: "http://eagle-api:3000"
      admin: "http://eagle-admin:8080"
      public: "http://eagle-public:8080"
      eguide: "http://eagle-api:3000"
      analytics: "http://penguin-analytics-api:3000"
      certbot: "http://certbot:8080"
      # eagle-search on Azure. Bare host: the /api is added by the proxy_pass in server.conf.tmpl.
      search: "https://eagle-search-api-dev.azurewebsites.net"

httpBasic:
  enabled: true
  directive: "auth_basic \"Restricted Content\"; auth_basic_user_file /tmp/.htpasswd;"
  # Credentials injected via GitHub secrets - do NOT hardcode
  username: ""
  password: ""
  
  eguide:
    enabled: false
    directive: ""
    username: ""
    password: ""
  
  public:
    enabled: true
    directive: "auth_basic \"Restricted Content\"; auth_basic_user_file /tmp/.htpasswd2;"
    username: ""
    password: ""

route:
  enabled: false  # Route is managed by eagle-api chart, matching test and prod
  host: eagle-dev.apps.silver.devops.gov.bc.ca

resources:
  limits:
    cpu: 50m
    memory: 50Mi
  requests:
    cpu: 30m
    memory: 25Mi

# Application configuration served at /config.json
config:
  environment: "dev"
  bannerColour: "red"
  logLevel: 0
  apiLocation: "https://eagle-dev.apps.silver.devops.gov.bc.ca"
  apiPath: "/api"
  # Sends Project, Document and DocumentChunk search to eagle-search; everything else stays on
  # eagle-api. Empty (the default everywhere else) means eagle-api for those too, which is the
  # rollback: blank it with `oc edit configmap rproxy-config` and clients revert on next load.
  #
  # RELATIVE, and without `/api` — unlike the Azure preview app's value, which is a full
  # `https://…/api` because it has no proxy in front of it. Here nginx supplies the /api.
  searchApiPath: "/eagle-search"
  adminPath: "/admin/"
  keycloak:
    clientId: "eagle-api-console"
    url: "https://dev.loginproxy.gov.bc.ca/auth"
    realm: "eao-epic"
    enabled: true
  analytics:
    apiUrl: "/analytics"
    debug: true
    enhancedTracking: true
    trafficTracking: true
  survey:
    url: null
    showBanner: false
  engage:
    apiUrl: "https://epic-engage-web-dev.apps.gold.devops.gov.bc.ca/api"
