replicaCount: 2

image:
  repository: image-registry.openshift-image-registry.svc:5000/6cdc9e-tools/rproxy
  pullPolicy: Always
  tag: "latest"
  name: "rproxy"
  namespace: "6cdc9e-tools"

nameOverride: ""
fullnameOverride: "rproxy"

# NetworkPolicy and Service selectors match these labels.
podLabels:
  role: "rproxy-eagle-epic"
  app: "eagle-epic"

nginx:
  ajax:
    serverName: "ajax.projects.eao.gov.bc.ca"
    redirect: "projects.eao.gov.bc.ca/p/ajax-mine/detail"
  
  epic:
    serverName: "localhost"
    proxy:
      root: "http://eagle-public:8080"
      api: "http://eagle-api:3000"
      admin: "http://eagle-admin:8080"
      public: "http://eagle-public:8080"
      eguide: "http://eagle-api:3000"
      # Azure APIM host set per environment; empty renders the deployment's unreachable sentinel.
      analytics: ""
      certbot: "http://certbot:8080"
      # No environment runs eagle-search; empty renders the deployment's unreachable sentinel.
      search: ""

httpBasic:
  # HTTP_BASIC: the directive applies only when enabled is true.
  enabled: false
  directive: ""
  username: ""
  password: ""
  
  # HTTP_BASIC1 and HTTP_BASIC2 take the directive whatever enabled says.
  eguide:
    enabled: false
    directive: ""
    username: ""
    password: ""

  # HTTP_BASIC2: the template has no /public block, but tags v2.7.7-v2.7.12 render one and
  # pr.yaml's chart-vs-tags guard needs every variable a tag at or above MIN_TAG expands.
  public:
    enabled: false
    directive: ""
    username: ""
    password: ""

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

route:
  enabled: true
  host: ""
  path: /
  timeout: "360s"  # must exceed the longest nginx proxy_read_timeout (120s, /api)
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  # Hook that patches HAProxy rate-limit annotations onto a Route Helm does not manage.
  patchAnnotations:
    enabled: false
    routeName: ""  # empty = chart fullname
    image: "bitnami/kubectl:1.30"

resources:
  limits:
    cpu: 250m
    memory: 150Mi
  requests:
    cpu: 30m
    memory: 50Mi

probes:
  liveness:
    path: /nginx_status
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
  readiness:
    path: /nginx_status
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

podAnnotations: {}

# Rendered into the rproxy-config ConfigMap. Only images below v2.7.11 serve it at /api/config;
# newer ones proxy that path to eagle-api.
config:
  environment: "local"
  bannerColour: ""
  logLevel: 0
  apiLocation: "http://localhost:3000"
  apiPath: "/api"
  adminPath: "/admin/"
  keycloak:
    clientId: "eagle-api-console"
    url: "https://dev.loginproxy.gov.bc.ca/auth"
    realm: "eao-epic"
    enabled: false
  survey:
    url: null
    showBanner: false
  # Needed for `helm lint` on this file alone: `| default ""` cannot save the nil `engage`
  # dereference in `.Values.config.engage.apiUrl`.
  engage:
    apiUrl: ""
