name: PR Checks

on:
  pull_request:
    branches:
      - master

permissions: read-all

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate nginx config template
        run: |
          # Check server.conf.tmpl exists
          if [ ! -f conf.d/server.conf.tmpl ]; then
            echo "Error: conf.d/server.conf.tmpl not found"
            exit 1
          fi
          
          # Check for required variables in template
          REQUIRED_VARS=(
            "NGINX__EPIC__PROXY__ROOT"
            "NGINX__EPIC__PROXY__API"
            "NGINX__EPIC__PROXY__ADMIN"
            "NGINX__EPIC__PROXY__ANALYTICS"
          )
          
          for var in "${REQUIRED_VARS[@]}"; do
            if ! grep -q "\${$var}" conf.d/server.conf.tmpl; then
              echo "Error: Required variable $var not found in server.conf.tmpl"
              exit 1
            fi
          done
          
          echo "✓ nginx config template validation passed"

      # The grep above cannot tell a valid config from one that will not start. envsubst turns an
      # empty ${VAR} into `proxy_pass ;`, which is [emerg], and conf.d is included into http {} — so
      # the whole reverse proxy crash-loops for that environment. Without this step that surfaces as
      # a five-minute `helm --wait` timeout after merge, not as a failed check here.
      #
      # Upstreams are pointed at 127.0.0.1 because nginx resolves every proxy_pass host at config
      # load and cluster Service names do not resolve on a runner.
      - name: nginx -t on the rendered template
        run: |
          render_and_test() {
            docker run --rm \
              --add-host eagle-public:127.0.0.1 --add-host eagle-api:127.0.0.1 \
              --add-host eagle-admin:127.0.0.1 --add-host penguin-analytics-api:127.0.0.1 \
              --add-host certbot:127.0.0.1 --add-host eagle-search.example.test:127.0.0.1 \
              --add-host demi-api.example.test:127.0.0.1 \
              -e NGINX__EPIC__SERVER_NAME=example.test \
              -e NGINX__AJAX__SERVER_NAME=ajax.example.test -e NGINX__AJAX__REDIRECT=example.test/x \
              -e NGINX__EPIC__PROXY__ROOT=http://eagle-public:8080 \
              -e NGINX__EPIC__PROXY__API=http://eagle-api:3000 \
              -e NGINX__EPIC__PROXY__ADMIN=http://eagle-admin:8080 \
              -e NGINX__EPIC__PROXY__EGUIDE=http://eagle-api:3000 \
              -e NGINX__EPIC__PROXY__ANALYTICS=http://penguin-analytics-api:3000 \
              -e NGINX__EPIC__PROXY__CERTBOT=http://certbot:8080 \
              -e NGINX__EPIC__PROXY__SEARCH="$1" \
              -e NGINX__EPIC__PROXY__DEMI="$2" \
              -e HTTP_BASIC= -e HTTP_BASIC1= \
              -v "$PWD/conf.d/server.conf.tmpl:/etc/nginx/templates/default.conf.template:ro" \
              -v "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro" \
              nginx:1.27-alpine sh -c '
                mkdir -p /etc/nginx/config && echo "{}" > /etc/nginx/config/config.json
                /docker-entrypoint.d/20-envsubst-on-templates.sh >/dev/null 2>&1
                nginx -t'
          }

          # Both shapes an environment can render: real https upstreams, and the localhost
          # sentinel that stands in where the service does not exist. SEARCH and DEMI take the
          # same two shapes and are varied together — only test has both, dev and prod render
          # the sentinel for at least one of them.
          #
          # The host is pinned to 127.0.0.1 like every other upstream here, and is deliberately
          # not a real one. nginx resolves each proxy_pass host at config load, so naming a live
          # Azure App Service made this step fail the day that estate was torn down (#30) — on
          # every branch, for a reason no PR had introduced. What is under test is that the
          # template renders and parses, not that somebody else's DNS still answers.
          render_and_test "https://eagle-search.example.test" "https://demi-api.example.test"
          render_and_test "http://localhost:9999" "http://localhost:9999"
          echo "✓ rendered config passes nginx -t"

      # nginx -t proves the config PARSES. It does not prove the auth directive is still in it.
      # Deleting the single ${HTTP_BASIC} line from `location /` leaves every step above green,
      # and since /public and /lib now fall through to that block, one deleted line un-gates three
      # paths in dev and test instead of one. So: start the dev shape and demand a 401.
      - name: The root location is auth-gated when a directive is supplied
        run: |
          set -euo pipefail
          # The REAL image, not nginx:1.27-alpine with the script mounted in. generate-htpasswd.sh
          # needs openssl, which the Dockerfile installs and the stock image does not have — mount
          # it into the stock image and generation silently fails, nginx cannot read the htpasswd
          # file, and every authenticated request 403s. That still satisfies a naive "not 401"
          # assertion, so the check would pass on completely broken auth wiring.
          docker build -q -t rproxy:authcheck . >/dev/null
          docker run -d --name authcheck -p 18085:8080 \
            --add-host eagle-public:127.0.0.1 --add-host eagle-api:127.0.0.1 \
            --add-host eagle-admin:127.0.0.1 --add-host penguin-analytics-api:127.0.0.1 \
            --add-host certbot:127.0.0.1 --add-host eagle-search.example.test:127.0.0.1 \
            -e NGINX__EPIC__SERVER_NAME=example.test \
            -e NGINX__AJAX__SERVER_NAME=ajax.example.test -e NGINX__AJAX__REDIRECT=example.test/x \
            -e NGINX__EPIC__PROXY__ROOT=http://127.0.0.1:9 \
            -e NGINX__EPIC__PROXY__API=http://eagle-api:3000 \
            -e NGINX__EPIC__PROXY__ADMIN=http://eagle-admin:8080 \
            -e NGINX__EPIC__PROXY__PUBLIC=http://eagle-public:8080 \
            -e NGINX__EPIC__PROXY__EGUIDE=http://eagle-api:3000 \
            -e NGINX__EPIC__PROXY__ANALYTICS=http://penguin-analytics-api:3000 \
            -e NGINX__EPIC__PROXY__CERTBOT=http://certbot:8080 \
            -e NGINX__EPIC__PROXY__SEARCH=http://localhost:9999 \
            -e NGINX__EPIC__PROXY__DEMI=http://localhost:9999 \
            -e HTTP_BASIC='auth_basic "Restricted Content"; auth_basic_user_file /tmp/.htpasswd;' \
            -e HTTP_BASIC1= -e HTTP_BASIC2= \
            -e USERNAME=ci -e PASSWORD=ci-secret \
            rproxy:authcheck
          for i in $(seq 20); do
            [ "$(docker inspect -f '{{.State.Running}}' authcheck)" = true ] || break
            # NOT /nginx_status: it is gated `allow 10.0.0.0/8; allow 127.0.0.1; deny all`, and a
            # request through `-p` arrives from the bridge gateway (172.17.0.1), so every poll 403s,
            # `curl -sf` fails, and the loop runs all 20 sleeps without ever detecting readiness.
            # Any status at all off `/` means nginx is answering; 401 is the expected one here.
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18085/)" != 000 ] && break
            sleep 1
          done
          rc=0
          # ALL THREE PATHS, not just `/`. This diff deleted the `location /public` and `location
          # /lib` blocks, so those two are now gated only by falling through to `location /` — they
          # are exactly the paths whose gating became implicit, and `/` is the one path that
          # structurally always carries the directive. Asserting `/` alone would stay green if a
          # future `location /public` were re-added without ${HTTP_BASIC}, which is the regression
          # this step exists to catch.
          #
          # /demi-search/search is here for the same reason and is the newest instance of it: it is
          # an exact-match location with its own ${HTTP_BASIC}, so nothing structural keeps it gated
          # — delete that one line and it becomes an anonymous internet-reachable proxy onto
          # demi-api while every page around it stays behind auth. DEMI points at the same dead
          # port as ROOT here, so the authenticated 502 assertion below reads identically for it.
          for p in / /public /lib /demi-search/search /demi-search/bulk-downloads /demi-search/bulk-downloads/z /demi-projects/000000000000000000000000; do
            anon=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:18085$p")
            auth=$(curl -s -u ci:ci-secret -o /dev/null -w '%{http_code}' "http://localhost:18085$p")
            echo "  anonymous $p -> $anon ; authenticated $p -> $auth"
            [ "$anon" = 401 ] || { echo "::error::$p served $anon anonymously; the auth directive is gone"; rc=1; }
            # Exactly 502, nothing looser. ROOT points at a closed port, so a request that reaches
            # the proxy_pass can only fail to connect — which proves the credential was accepted AND
            # that the request got past the auth phase. 401/403 mean auth rejected it (403
            # specifically = nginx could not read the htpasswd file), and a "not 401" assertion
            # would pass on that.
            [ "$auth" = 502 ] || { echo "::error::$p with valid credentials got $auth, expected 502 from the dead upstream — auth is not accepting them"; rc=1; }
          done
          # THE EXACT MATCH IS A SECURITY CONTROL AND NOTHING ABOVE ASSERTS IT. Relaxing
          # `location = /demi-search/search` to a `^~` prefix leaves every gate in this file green,
          # while demi-api starts receiving /api/documents?pageSize=1000, /api/projects,
          # /api/api-docs and /api/boundaries — its whole route table, anonymously, on a gov.bc.ca
          # origin. Changing the upstream path stays green too, so nothing asserted routing at all.
          #
          # Status cannot discriminate: both upstreams are dead, so everything is 502. The
          # discriminator is WHICH upstream nginx tried, read out of the error log — ROOT is
          # 127.0.0.1:9 and DEMI is 127.0.0.1:9999, deliberately different ports.
          for p in /demi-search/documents /demi-search/projects /demi-search/api-docs /demi-search/boundaries /demi-search/ /demi-search/search/ \
                   /demi-projects /demi-projects/ /demi-projects/notanobjectid /demi-projects/000000000000000000000000/documents; do
            curl -sg -u ci:ci-secret -o /dev/null "http://localhost:18085$p"
          done
          # Only GET and HEAD may reach demi-api on the project route; `limit_except GET` answers 403
          # for everything else, and the upstream-path count below proves it never got proxied.
          m=$(curl -sg -X POST -u ci:ci-secret -o /dev/null -w '%{http_code}' "http://localhost:18085/demi-projects/000000000000000000000000")
          [ "$m" = 403 ] || { echo "::error::POST /demi-projects/<id> got $m, expected 403 — limit_except GET is gone"; rc=1; }
          curl -sg -u ci:ci-secret -o /dev/null "http://localhost:18085/demi-search/search?dataset=Project"
          # Match every form nginx logs for the demi upstream: a resolved address on the first try
          # (127.0.0.1:9999 or [::1]:9999) and the bare hostname it prints for "no live upstreams",
          # which is what a worker logs for any later request inside the 10 s fail_timeout after a
          # refused connect. Keying on one form made the count depend on which worker took the
          # request. Paths only, query string dropped — ROOT is 127.0.0.1:9 and never matches.
          demi_hits=$(docker logs authcheck 2>&1 \
            | sed -nE 's#.*upstream: "http://(127\.0\.0\.1:9999|\[::1\]:9999|localhost)(/[^"?]*)[^"]*".*#\2#p' \
            | sort -u)
          echo "$demi_hits"
          # Exactly four upstream URIs may ever be reached: /api/search from the exact-match search
          # location, /api/bulk-downloads plus /api/bulk-downloads/z from the bulk-downloads prefix
          # location, and one /api/projects/<ObjectId> from the /demi-projects regex (all probed by
          # the loops above). Anything else means a location widened and demi-api's route table is
          # reachable anonymously — including a bare /api/projects, its list route, which the
          # /demi-projects probes deliberately try to provoke.
          [ "$(echo "$demi_hits" | grep -c .)" = 4 ] \
            || { echo "::error::unexpected set of upstream paths reached demi-api — a location is wider than intended"; rc=1; }
          for u in /api/search /api/bulk-downloads /api/bulk-downloads/z /api/projects/000000000000000000000000; do
            echo "$demi_hits" | grep -qx "$u" \
              || { echo "::error::demi-api was not reached at the expected upstream path $u"; rc=1; }
          done
          # Short links ride the same upstream. /s/<code> must reach demi-api as /api/s/<code>, the
          # /s/ segment kept: dropping it maps /s/projects onto demi-api's real /projects route.
          curl -sg -u ci:ci-secret -o /dev/null "http://localhost:18085/s/projects"
          # Host, not port: after the first 502 nginx marks the server down and logs later hits as
          # "no live upstreams" with the unresolved host name instead of 127.0.0.1:9999.
          docker logs authcheck 2>&1 | grep -q 'request: "GET /s/projects [^"]*", upstream: "http://[^"]*/api/s/projects"' \
            || { echo "::error::/s/projects did not reach demi-api as /api/s/projects — the /s/ prefix is being stripped"; rc=1; }

          # THE CREDENTIAL STRIP, asserted rather than assumed. `location /` sends
          # `proxy_set_header Authorization ""` so the shared dev/test basic-auth credential does not
          # leave the cluster to the Front Door upstream. Deleting that line leaves every assertion
          # above byte-identical — they all read status codes, and the header is invisible to them.
          #
          # So this uses a REPORTING upstream instead of a dead port: a one-shot listener that writes
          # the request it received. `--network host` puts nginx in the runner's netns, so
          # 127.0.0.1:19099 reaches it.
          ( printf 'HTTP/1.1 204 No Content\r\nConnection: close\r\n\r\n' | timeout 20 nc -l -p 19099 > /tmp/upstream-req.txt ) &
          listener=$!
          docker run -d --name authstrip --network host \
            -e NGINX__EPIC__SERVER_NAME=localhost \
            -e NGINX__AJAX__SERVER_NAME=ajax.localhost -e NGINX__AJAX__REDIRECT=localhost/x \
            -e NGINX__EPIC__PROXY__ROOT=http://127.0.0.1:19099 \
            -e NGINX__EPIC__PROXY__API=http://127.0.0.1:9 -e NGINX__EPIC__PROXY__ADMIN=http://127.0.0.1:9 \
            -e NGINX__EPIC__PROXY__EGUIDE=http://127.0.0.1:9 -e NGINX__EPIC__PROXY__ANALYTICS=http://127.0.0.1:9 \
            -e NGINX__EPIC__PROXY__CERTBOT=http://127.0.0.1:9 \
            -e NGINX__EPIC__PROXY__SEARCH=http://127.0.0.1:9 -e NGINX__EPIC__PROXY__DEMI=http://127.0.0.1:9999 \
            -e HTTP_BASIC='auth_basic "Restricted Content"; auth_basic_user_file /tmp/.htpasswd;' \
            -e HTTP_BASIC1= -e HTTP_BASIC2= \
            -e USERNAME=ci -e PASSWORD=ci-secret \
            rproxy:authcheck >/dev/null
          for i in $(seq 1 20); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' -u ci:ci-secret http://localhost:8080/ 2>/dev/null)" != "000" ] && break
            sleep 1
          done
          curl -s -o /dev/null -u ci:ci-secret http://localhost:8080/ || true
          wait $listener 2>/dev/null || true
          docker rm -f authstrip >/dev/null 2>&1 || true

          # The listener must have seen the request at all, or this proves nothing either way.
          grep -qi '^GET / HTTP' /tmp/upstream-req.txt \
            || { echo "::error::the reporting upstream never received the request — this check cannot discriminate, fix it rather than trusting it"; rc=1; }
          grep -qi '^authorization:' /tmp/upstream-req.txt \
            && { echo "::error::location / forwarded the Authorization header upstream — the shared basic-auth credential leaves the cluster on every page request. Restore proxy_set_header Authorization \"\"; in that block"; rc=1; }
          echo "  location / upstream saw $(grep -c . /tmp/upstream-req.txt) header line(s), Authorization absent"

          # Worker cap: `auto` means one worker per node core (32 on silver), the OOM kills behind the
          # 2026-09-02 test 502s, and nginx -t and helm lint both stay green if it comes back.
          workers=$(docker exec authcheck ps -o args | grep -c 'nginx: worker process' || true)
          [ "$workers" = 2 ] || { echo "::error::nginx.conf must keep worker_processes 2, saw $workers workers"; rc=1; }
          echo "  nginx workers: $workers"

          docker logs authcheck 2>&1 | tail -5
          docker rm -f authcheck >/dev/null
          exit $rc

      # THE CHART MUST SATISFY EVERY DEPLOYABLE IMAGE, NOT JUST THIS COMMIT'S TEMPLATE.
      # deploy-to-{test,prod}.yaml check out with no `ref:`, so they render the DEFAULT BRANCH's
      # chart while `--set image.tag` selects an older image. If the chart stops supplying a
      # variable a released template still expands, the entrypoint's envsubst leaves it as a
      # literal, nginx parses it as a directive and refuses to start with `[emerg] unexpected "}"`.
      # That breaks every deploy of, and rollback to, that tag. The `nginx -t` step above cannot
      # catch it: it supplies its own env by hand rather than deriving it from the chart.
      - name: Chart supplies every variable released templates expand
        run: |
          set -euo pipefail
          git fetch --tags --quiet --force
          # A NAME IS NOT ALWAYS ENOUGH. Rendering `- name: X` with `value: ""` protects nothing
          # where the variable sits INSIDE a directive: envsubst substitutes the empty string, so
          # `proxy_pass ${X};` becomes `proxy_pass ;` and nginx refuses to start with [emerg].
          # Where the variable IS the whole directive — ${HTTP_BASIC}, ${HTTP_BASIC1}, ${HTTP_BASIC2}
          # — empty is legitimate and means "no auth here", which is exactly how prod renders them.
          # So: every name must be present, and every upstream (NGINX__*PROXY__*) must also be
          # non-empty.
          # EVERY environment, not just prod. Rendering values-prod.yaml alone left the same
          # [emerg] crash-loop shippable to dev and test: an upstream emptied in values-dev.yaml
          # only is invisible to a prod render, and dev is where a broken rproxy is most likely to
          # be introduced. Each env is rendered separately rather than intersected so the error can
          # name the file to fix — "the chart is missing X" sends someone to the wrong values file.
          ENVS="dev test prod"
          for e in $ENVS; do
            : > "/tmp/chart-env.$e.txt"; : > "/tmp/chart-nonempty.$e.txt"
            helm template rproxy ./helm/rproxy -f "helm/rproxy/values-$e.yaml" \
              | awk -v env="$e" '/^[[:space:]]+- name: [A-Z_0-9]+$/ { n=$3; next }
                     n != "" {
                       if ($0 ~ /^[[:space:]]+value:/) {
                         v=$0; sub(/^[[:space:]]*value:[[:space:]]*/,"",v); gsub(/^"|"$/,"",v)
                         print n > ("/tmp/chart-env." env ".txt")
                         if (v != "") print n > ("/tmp/chart-nonempty." env ".txt")
                       }
                       n=""
                     }'
            sort -u -o "/tmp/chart-env.$e.txt" "/tmp/chart-env.$e.txt"
            sort -u -o "/tmp/chart-nonempty.$e.txt" "/tmp/chart-nonempty.$e.txt"
          done
          rc=0
          # EVERY tag at or above MIN_TAG, not "the last N". An earlier version used `tail -6`,
          # which silently excluded v2.7.6 — the one tag that actually fails this check — so the
          # guard exited 0 on the case it exists to catch. A window defined by a magic number
          # cannot be reasoned about; a floor with a stated reason can.
          #
          # MIN_TAG is v2.7.7 because v2.7.6 expands ${NGINX__EPIC__PROXY__TYPESENSE}, and the
          # Typesense estate was deleted on 2026-08-21 — dev, test and prod. Rolling back to it
          # would proxy at a service that no longer exists, so it is not a deployable target and
          # the chart is not required to satisfy it.
          MIN_TAG=v2.7.7
          checked=0
          # WORKING-TREE FIRST, then the released tags. Checking only released tags catches a
          # variable REMOVED from the chart, but not one ADDED to the template — which is the
          # commoner mistake: a developer adds `location /x { proxy_pass ${NGINX__..._X}; }` and
          # forgets deployment.yaml. That passes every other check here and then the pod dies with
          # `[emerg] unknown "nginx__..._x" variable`. HEAD's variable set being a subset of the
          # released union is incidental today; it lapses the first time someone adds one.
          for tag in WORKING_TREE $(git for-each-ref --format='%(refname:short)' refs/tags \
                        | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V \
                        | awk -v min="$MIN_TAG" 'min=="" || $0==min {p=1} p'); do
            if [ "$tag" = WORKING_TREE ]; then
              cat conf.d/server.conf.tmpl
            else
              git show "$tag:conf.d/server.conf.tmpl" 2>/dev/null
            fi | grep -o '\${[A-Z_0-9]*}' | tr -d '${}' | sort -u > /tmp/tag-vars.txt || continue
            bad=0
            for e in $ENVS; do
              missing=$(comm -23 /tmp/tag-vars.txt "/tmp/chart-env.$e.txt" | tr '\n' ' ')
              # An upstream the chart renders as "" is as fatal as one it omits entirely.
              blank=$(grep -E 'PROXY__' /tmp/tag-vars.txt | sort -u \
                       | comm -23 - "/tmp/chart-nonempty.$e.txt" | tr '\n' ' ')
              [ -n "$missing" ] && echo "::error::values-$e.yaml does not supply, for image tag $tag: $missing" && bad=1
              [ -n "$blank" ] && echo "::error::values-$e.yaml renders an EMPTY upstream, for image tag $tag: $blank" && bad=1
            done
            if [ "$bad" = 1 ]; then rc=1; else echo "  $tag OK"; fi
            # WORKING_TREE deliberately does NOT count. It is present on every run, so counting it
            # would make the floor check below unreachable and silently revert it.
            [ "$tag" = WORKING_TREE ] || checked=$((checked + 1))
          done
          # A floor that matches nothing checks nothing, prints nothing and exits 0 — the same
          # silent pass this guard replaced. If MIN_TAG is ever deleted, retagged or mistyped, say
          # so loudly instead.
          if [ "$checked" -eq 0 ]; then
            echo "::error::no RELEASED tags at or above MIN_TAG=$MIN_TAG were examined — the guard checked only the working tree"
            exit 1
          fi
          echo "  checked $checked tag(s) from $MIN_TAG up"
          exit $rc

      - name: Validate Helm chart
        run: |
          # Check Helm chart structure
          if [ ! -f helm/rproxy/Chart.yaml ]; then
            echo "Error: helm/rproxy/Chart.yaml not found"
            exit 1
          fi
          
          if [ ! -f helm/rproxy/values.yaml ]; then
            echo "Error: helm/rproxy/values.yaml not found"
            exit 1
          fi
          
          # Lint Helm chart
          helm lint helm/rproxy
          
          echo "✓ Helm chart validation passed"

      - name: Validate Dockerfile
        run: |
          # Check Dockerfile exists
          if [ ! -f Dockerfile ]; then
            echo "Error: Dockerfile not found"
            exit 1
          fi
          
          # Check for required elements
          if ! grep -q "FROM nginx:1.27-alpine" Dockerfile; then
            echo "Error: Dockerfile must use nginx:1.27-alpine base image"
            exit 1
          fi
          
          if ! grep -q "EXPOSE 8080" Dockerfile; then
            echo "Error: Dockerfile must expose port 8080"
            exit 1
          fi
          
          echo "✓ Dockerfile validation passed"
