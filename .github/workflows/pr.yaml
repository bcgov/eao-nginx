name: PR Checks

on:
  pull_request:
    branches:
      - master

permissions: read-all

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate nginx config template
        run: |
          if [ ! -f conf.d/server.conf.tmpl ]; then
            echo "Error: conf.d/server.conf.tmpl not found"
            exit 1
          fi
          
          REQUIRED_VARS=(
            "NGINX__EPIC__PROXY__ROOT"
            "NGINX__EPIC__PROXY__API"
            "NGINX__EPIC__PROXY__ANALYTICS"
          )
          
          for var in "${REQUIRED_VARS[@]}"; do
            if ! grep -q "\${$var}" conf.d/server.conf.tmpl; then
              echo "Error: Required variable $var not found in server.conf.tmpl"
              exit 1
            fi
          done

          # Authorization strip on /demi-projects. The directive is literal, so the raw template is what
          # ships; only that block is read, so a strip elsewhere cannot hide a missing one.
          demi_projects_block=$(awk '/^  location ~ "\^\/demi-projects/{f=1} f{print} f && /^  \}/{exit}' conf.d/server.conf.tmpl)
          echo "$demi_projects_block" | grep -qF 'proxy_set_header Authorization "";' \
            || { echo "Error: /demi-projects location block is missing proxy_set_header Authorization \"\";"; exit 1; }

          # Front Door sends every /demi-projects/* here; a non-ObjectId path that falls to `location /`
          # loops back to Front Door until a 504. Plain prefix, no `^~`, so the ObjectId regex still wins.
          grep -qE '^  location /demi-projects/ \{' conf.d/server.conf.tmpl \
            || { echo "Error: /demi-projects/ terminator location is missing from server.conf.tmpl"; exit 1; }

          # Same strip on /demi-search/config: eagle-public boots off it, so a forwarded dev/test
          # credential would leave the cluster on every page load.
          demi_config_block=$(awk '/^  location = \/demi-search\/config \{/{f=1} f{print} f && /^  \}/{exit}' conf.d/server.conf.tmpl)
          [ -n "$demi_config_block" ] \
            || { echo "Error: location = /demi-search/config is missing from server.conf.tmpl"; exit 1; }
          echo "$demi_config_block" | grep -qF 'proxy_set_header Authorization "";' \
            || { echo "Error: /demi-search/config location block is missing proxy_set_header Authorization \"\";"; exit 1; }

          echo "✓ nginx config template validation passed"

      # An empty variable renders `proxy_pass ;`, an [emerg] the grep above cannot see. Upstreams map
      # to 127.0.0.1 because nginx resolves proxy_pass hosts at load and cluster names fail on a runner.
      - name: nginx -t on the rendered template
        run: |
          render_and_test() {
            docker run --rm \
              --add-host eagle-public:127.0.0.1 --add-host eagle-api:127.0.0.1 \
              --add-host certbot:127.0.0.1 --add-host eagle-search.example.test:127.0.0.1 \
              --add-host demi-api.example.test:127.0.0.1 \
              --add-host demi-apim.example.test:127.0.0.1 \
              -e NGINX__EPIC__SERVER_NAME=example.test \
              -e NGINX__AJAX__SERVER_NAME=ajax.example.test -e NGINX__AJAX__REDIRECT=example.test/x \
              -e NGINX__EPIC__PROXY__ROOT=http://eagle-public:8080 \
              -e NGINX__EPIC__PROXY__API=http://eagle-api:3000 \
              -e NGINX__EPIC__PROXY__ADMIN=http://eagle-admin:8080 \
              -e NGINX__EPIC__PROXY__EGUIDE=http://eagle-api:3000 \
              -e NGINX__EPIC__PROXY__CERTBOT=http://certbot:8080 \
              -e NGINX__EPIC__PROXY__SEARCH="$1" \
              -e NGINX__EPIC__PROXY__DEMI="$2" \
              -e NGINX__EPIC__PROXY__ANALYTICS="$3" \
              -e HTTP_BASIC= -e HTTP_BASIC1= \
              -v "$PWD/conf.d/server.conf.tmpl:/etc/nginx/templates/default.conf.template:ro" \
              -v "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro" \
              nginx:1.27-alpine sh -c '
                mkdir -p /etc/nginx/config && echo "{}" > /etc/nginx/config/config.json
                /docker-entrypoint.d/20-envsubst-on-templates.sh >/dev/null 2>&1
                nginx -t'
          }

          # Both shapes an upstream can render: an https host, the only one reaching proxy_ssl_server_name,
          # and the localhost sentinel. Hosts are fake, pinned to 127.0.0.1: this tests the template, not DNS.
          render_and_test "https://eagle-search.example.test" "https://demi-api.example.test" \
            "https://demi-apim.example.test"
          render_and_test "http://localhost:9999" "http://localhost:9999" \
            "http://localhost:9999"
          echo "✓ rendered config passes nginx -t"

      # nginx -t proves the config parses, not that the auth directive is still in it: start the dev
      # shape and demand a 401.
      - name: The root location is auth-gated when a directive is supplied
        run: |
          set -euo pipefail
          # The real image, not the stock one: generate-htpasswd.sh needs openssl, and without it every
          # authenticated request 403s, which a "not 401" check would pass.
          docker build -q -t rproxy:authcheck . >/dev/null
          docker run -d --name authcheck -p 18085:8080 \
            --add-host eagle-public:127.0.0.1 --add-host eagle-api:127.0.0.1 \
            --add-host certbot:127.0.0.1 --add-host eagle-search.example.test:127.0.0.1 \
            -e NGINX__EPIC__SERVER_NAME=example.test \
            -e NGINX__AJAX__SERVER_NAME=ajax.example.test -e NGINX__AJAX__REDIRECT=example.test/x \
            -e NGINX__EPIC__PROXY__ROOT=http://127.0.0.1:9 \
            -e NGINX__EPIC__PROXY__API=http://eagle-api:3000 \
            -e NGINX__EPIC__PROXY__ADMIN=http://eagle-admin:8080 \
            -e NGINX__EPIC__PROXY__PUBLIC=http://eagle-public:8080 \
            -e NGINX__EPIC__PROXY__EGUIDE=http://eagle-api:3000 \
            -e NGINX__EPIC__PROXY__ANALYTICS=http://localhost:9999 \
            -e NGINX__EPIC__PROXY__CERTBOT=http://certbot:8080 \
            -e NGINX__EPIC__PROXY__SEARCH=http://localhost:9999 \
            -e NGINX__EPIC__PROXY__DEMI=http://localhost:9999 \
            -e HTTP_BASIC='auth_basic "Restricted Content"; auth_basic_user_file /tmp/.htpasswd;' \
            -e HTTP_BASIC1= -e HTTP_BASIC2= \
            -e USERNAME=ci -e PASSWORD=ci-secret \
            rproxy:authcheck
          for i in $(seq 20); do
            [ "$(docker inspect -f '{{.State.Running}}' authcheck)" = true ] || break
            # Not /nginx_status: `-p` requests arrive from the bridge gateway, which its allow list 403s.
            # Any status off `/` means nginx is answering.
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18085/)" != 000 ] && break
            sleep 1
          done
          rc=0
          # Every path, not just `/`: /public and /lib are gated only by falling through to `location /`,
          # and the exact-match /demi-* locations each carry their own auth line.
          for p in / /public /lib /demi-search/search /demi-search/config /demi-search/bulk-downloads /demi-search/bulk-downloads/z /demi-projects/000000000000000000000000; do
            anon=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:18085$p")
            auth=$(curl -s -u ci:ci-secret -o /dev/null -w '%{http_code}' "http://localhost:18085$p")
            echo "  anonymous $p -> $anon ; authenticated $p -> $auth"
            [ "$anon" = 401 ] || { echo "::error::$p served $anon anonymously; the auth directive is gone"; rc=1; }
            # Exactly 502: the upstreams are closed ports, so only a request past the auth phase gets it.
            # 401 or 403 mean auth rejected it (403 = nginx could not read the htpasswd file).
            [ "$auth" = 502 ] || { echo "::error::$p with valid credentials got $auth, expected 502 from the dead upstream — auth is not accepting them"; rc=1; }
          done
          # `location = /demi-search/search` must stay exact or demi-api's whole route table opens. Status
          # cannot show it (all 502); the error log names the upstream tried: ROOT is port 9, DEMI 9999.
          for p in /demi-search/documents /demi-search/projects /demi-search/api-docs /demi-search/boundaries /demi-search/ /demi-search/search/ \
                   /demi-projects /demi-projects/ /demi-projects/notanobjectid /demi-projects/000000000000000000000000/documents; do
            curl -sg -u ci:ci-secret -o /dev/null "http://localhost:18085$p"
          done
          # Only GET and HEAD may reach demi-api on the project route; `limit_except GET` answers 403
          # for everything else, and the upstream-path count below proves it never got proxied.
          m=$(curl -sg -X POST -u ci:ci-secret -o /dev/null -w '%{http_code}' "http://localhost:18085/demi-projects/000000000000000000000000")
          [ "$m" = 403 ] || { echo "::error::POST /demi-projects/<id> got $m, expected 403 — limit_except GET is gone"; rc=1; }
          # A non-ObjectId path must 404, not fall to `location /`, which loops via Front Door to a 504.
          nf=$(curl -sg -u ci:ci-secret -o /dev/null -w '%{http_code}' "http://localhost:18085/demi-projects/notanobjectid")
          [ "$nf" = 404 ] || { echo "::error::GET /demi-projects/notanobjectid got $nf, expected 404 — the terminator location is gone"; rc=1; }
          curl -sg -u ci:ci-secret -o /dev/null "http://localhost:18085/demi-search/search?dataset=Project"
          # Match every form nginx logs for the demi upstream: an address on the first try, and the bare
          # host it prints for "no live upstreams" inside fail_timeout. ROOT on port 9 never matches.
          demi_hits=$(docker logs authcheck 2>&1 \
            | sed -nE 's#.*upstream: "http://(127\.0\.0\.1:9999|\[::1\]:9999|localhost)(/[^"?]*)[^"]*".*#\2#p' \
            | sort -u)
          echo "$demi_hits"
          # Exactly these five upstream URIs; any other means a location widened. /api/config/public is
          # named: /api/config would serve a config document with no public keys and no ACCESS_GATE.
          [ "$(echo "$demi_hits" | grep -c .)" = 5 ] \
            || { echo "::error::unexpected set of upstream paths reached demi-api — a location is wider than intended"; rc=1; }
          for u in /api/search /api/config/public /api/bulk-downloads /api/bulk-downloads/z /api/projects/000000000000000000000000; do
            echo "$demi_hits" | grep -qx "$u" \
              || { echo "::error::demi-api was not reached at the expected upstream path $u"; rc=1; }
          done
          # Short links ride the same upstream. /s/<code> must reach demi-api as /api/s/<code>, the
          # /s/ segment kept: dropping it maps /s/projects onto demi-api's real /projects route.
          curl -sg -u ci:ci-secret -o /dev/null "http://localhost:18085/s/projects"
          # Host, not port: after the first 502 nginx marks the server down and logs later hits as
          # "no live upstreams" with the unresolved host name instead of 127.0.0.1:9999.
          docker logs authcheck 2>&1 | grep -q 'request: "GET /s/projects [^"]*", upstream: "http://[^"]*/api/s/projects"' \
            || { echo "::error::/s/projects did not reach demi-api as /api/s/projects — the /s/ prefix is being stripped"; rc=1; }

          # Authorization strip on `location /`, read off a reporting upstream: status codes cannot see it.
          # `nc -l` serves one connection, so each listener starts just before its request, bind awaited.
          start_upstream() {  # $1 = port, $2 = file to write the request it receives to
            : > "$2"
            ( printf 'HTTP/1.1 204 No Content\r\nConnection: close\r\n\r\n' | timeout 30 nc -l -p "$1" > "$2" ) &
            upstream_pid=$!
            timeout 10 sh -c "until ss -ltn 2>/dev/null | grep -q ':$1 '; do sleep 0.2; done" \
              || { echo "::error::the reporting upstream on port $1 never started listening — fix this check rather than trusting it"; rc=1; }
          }
          # The analytics gateway reports on 19098: the port that got the request shows which upstream.
          docker run -d --name authstrip --network host \
            -e NGINX__EPIC__SERVER_NAME=localhost \
            -e NGINX__AJAX__SERVER_NAME=ajax.localhost -e NGINX__AJAX__REDIRECT=localhost/x \
            -e NGINX__EPIC__PROXY__ROOT=http://127.0.0.1:19099 \
            -e NGINX__EPIC__PROXY__API=http://127.0.0.1:9 -e NGINX__EPIC__PROXY__ADMIN=http://127.0.0.1:9 \
            -e NGINX__EPIC__PROXY__EGUIDE=http://127.0.0.1:9 \
            -e NGINX__EPIC__PROXY__ANALYTICS=http://127.0.0.1:19098 \
            -e NGINX__EPIC__PROXY__CERTBOT=http://127.0.0.1:9 \
            -e NGINX__EPIC__PROXY__SEARCH=http://127.0.0.1:9 -e NGINX__EPIC__PROXY__DEMI=http://127.0.0.1:19096 \
            -e HTTP_BASIC='auth_basic "Restricted Content"; auth_basic_user_file /tmp/.htpasswd;' \
            -e HTTP_BASIC1= -e HTTP_BASIC2= \
            -e USERNAME=ci -e PASSWORD=ci-secret \
            rproxy:authcheck >/dev/null
          # /nginx_status for readiness: it cannot spend a listener, and with `--network host` requests come
          # from 127.0.0.1, which its allow list admits.
          for i in $(seq 1 20); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/nginx_status 2>/dev/null)" = 200 ] && break
            sleep 1
          done

          start_upstream 19099 /tmp/upstream-req.txt
          curl -s -o /dev/null -u ci:ci-secret http://localhost:8080/ || true
          wait $upstream_pid 2>/dev/null || true

          # Bare /analytics, still POSTed by cached bundles: nginx answers 410 and proxies nothing.
          gone=$(curl -s -o /dev/null -w '%{http_code}' -X POST -u ci:ci-secret http://localhost:8080/analytics)
          [ "$gone" = 410 ] || { echo "::error::POST /analytics answered $gone, expected 410 — the retired bare ingest URL is being proxied somewhere again"; rc=1; }
          echo "  POST /analytics -> $gone"

          # /api/analytics rewrites onto the block above; a 502 means it fell through to eagle-api.
          alias=$(curl -s -o /dev/null -w '%{http_code}' -X POST -u ci:ci-secret http://localhost:8080/api/analytics)
          [ "$alias" = 410 ] || { echo "::error::POST /api/analytics answered $alias, expected 410 — the rewrite onto the bare /analytics block is gone"; rc=1; }
          echo "  POST /api/analytics -> $alias"

          # Retired GC Notify webhook: 410 before the access phase. Falling through to `^~ /analytics/`
          # would send a same-origin credential to APIM, seen here as a non-410.
          hook=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Authorization: Bearer ci-probe' \
            http://localhost:8080/analytics/webhook/gcnotify)
          [ "$hook" = 410 ] || { echo "::error::POST /analytics/webhook/gcnotify answered $hook, expected 410 — the retired webhook path is reaching the analytics gateway with its Authorization header"; rc=1; }
          echo "  POST /analytics/webhook/gcnotify -> $hook"

          # The slash-less spelling of the same retired path. It has its own exact-match block; drop
          # that block and this URL alone falls to `^~ /analytics/` and reaches the gateway.
          bare=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Authorization: Bearer ci-probe' \
            http://localhost:8080/analytics/webhook)
          [ "$bare" = 410 ] || { echo "::error::POST /analytics/webhook answered $bare, expected 410 — the slash-less webhook path is reaching the analytics gateway with its Authorization header"; rc=1; }
          echo "  POST /analytics/webhook -> $bare"

          # A bearer, the header that must not survive: eagle-admin attaches its Keycloak token to
          # same-origin XHRs, and this upstream is APIM outside the cluster.
          start_upstream 19098 /tmp/upstream-events.txt
          curl -s -o /dev/null -X POST -H 'Authorization: Bearer ci-probe-token' \
            http://localhost:8080/analytics/events || true
          wait $upstream_pid 2>/dev/null || true

          # Reporting path: the bearer is eagle-analytics' authorization, so it must survive.
          start_upstream 19098 /tmp/upstream-query.txt
          curl -s -o /dev/null -X POST -H 'Authorization: Bearer ci-probe-token' \
            http://localhost:8080/analytics/query || true
          wait $upstream_pid 2>/dev/null || true

          # Browser-facing /api/usage/ prefix (ad blockers drop URLs containing "analytics"), rewritten
          # to /analytics/. Probe ingest, which must lose the credential, and a sibling that keeps it.
          start_upstream 19098 /tmp/upstream-usage-events.txt
          curl -s -o /dev/null -X POST -H 'Authorization: Bearer ci-probe-token' \
            http://localhost:8080/api/usage/events || true
          wait $upstream_pid 2>/dev/null || true

          start_upstream 19098 /tmp/upstream-usage-query.txt
          curl -s -o /dev/null -X POST -H 'Authorization: Bearer ci-probe-token' \
            http://localhost:8080/api/usage/query || true
          wait $upstream_pid 2>/dev/null || true

          # Same strip on every demi location; a forwarded credential also trips demi-api's forged-
          # credential path. The upstream URI is checked too, so a widened location cannot pass.
          while read -r path upstream_path; do
            start_upstream 19096 /tmp/upstream-demi.txt
            curl -sg -o /dev/null -u ci:ci-secret "http://localhost:8080$path" || true
            wait $upstream_pid 2>/dev/null || true
            echo "  GET $path -> demi upstream saw: $(head -1 /tmp/upstream-demi.txt | tr -d '\r')"
            grep -qiE "^GET $upstream_path(\?[^ ]*)? HTTP" /tmp/upstream-demi.txt \
              || { echo "::error::GET $path did not reach demi-api as $upstream_path — this check cannot discriminate, fix it rather than trusting it"; rc=1; }
            grep -qi '^authorization:' /tmp/upstream-demi.txt \
              && { echo "::error::location $path forwarded the Authorization header to demi-api — the shared basic-auth credential leaves the cluster and demi-api logs it as a forged credential. Restore proxy_set_header Authorization \"\"; in that block"; rc=1; }
          done <<'DEMI_PATHS'
          /demi-search/search?dataset=Project /api/search
          /demi-search/bulk-downloads /api/bulk-downloads
          /s/abc /api/s/abc
          /demi-projects/000000000000000000000000 /api/projects/000000000000000000000000
          DEMI_PATHS

          docker rm -f authstrip >/dev/null 2>&1 || true

          # The listener must have seen the request at all, or this proves nothing either way.
          grep -qi '^GET / HTTP' /tmp/upstream-req.txt \
            || { echo "::error::the reporting upstream never received the request — this check cannot discriminate, fix it rather than trusting it"; rc=1; }
          grep -qi '^authorization:' /tmp/upstream-req.txt \
            && { echo "::error::location / forwarded the Authorization header upstream — the shared basic-auth credential leaves the cluster on every page request. Restore proxy_set_header Authorization \"\"; in that block"; rc=1; }
          echo "  location / upstream saw $(grep -c . /tmp/upstream-req.txt) header line(s), Authorization absent"

          grep -qi '^POST /analytics/events HTTP' /tmp/upstream-events.txt \
            || { echo "::error::POST /analytics/events did not reach the analytics gateway as /analytics/events — the new API's ingest path is not routed"; rc=1; }
          grep -qi '^authorization:' /tmp/upstream-events.txt \
            && { echo "::error::location /analytics/events forwarded the Authorization header upstream — a Keycloak bearer token or the shared basic-auth credential leaves the cluster to the analytics gateway. Restore proxy_set_header Authorization \"\"; in that block"; rc=1; }
          echo "  POST /analytics/events -> gateway upstream saw: $(head -1 /tmp/upstream-events.txt | tr -d '\r')"

          grep -qi '^POST /analytics/query HTTP' /tmp/upstream-query.txt \
            || { echo "::error::POST /analytics/query did not reach the analytics gateway as /analytics/query — the staff reporting path is not routed"; rc=1; }
          grep -qi '^authorization: bearer ci-probe-token' /tmp/upstream-query.txt \
            || { echo "::error::POST /analytics/query lost its Authorization header — the strip belongs on /analytics/events only, and eagle-analytics authorizes the reporting screens on that bearer"; rc=1; }
          echo "  POST /analytics/query -> gateway upstream saw: $(head -1 /tmp/upstream-query.txt | tr -d '\r')"

          # The upstream URI proves the rewrite: no /analytics/ path means proxy_pass lost its URI part;
          # nothing arriving means eagle-api answered.
          grep -qi '^POST /analytics/events HTTP' /tmp/upstream-usage-events.txt \
            || { echo "::error::POST /api/usage/events did not reach the analytics gateway as /analytics/events — the browser-facing ingest prefix is unrouted, its proxy_pass URI is wrong, or the request fell through to location /api"; rc=1; }
          grep -qi '^authorization:' /tmp/upstream-usage-events.txt \
            && { echo "::error::location /api/usage/events forwarded the Authorization header upstream — a Keycloak bearer token or the shared basic-auth credential leaves the cluster to the analytics gateway. Restore proxy_set_header Authorization \"\"; in that block"; rc=1; }
          echo "  POST /api/usage/events -> gateway upstream saw: $(head -1 /tmp/upstream-usage-events.txt | tr -d '\r')"

          grep -qi '^POST /analytics/query HTTP' /tmp/upstream-usage-query.txt \
            || { echo "::error::POST /api/usage/query did not reach the analytics gateway as /analytics/query — the /api/usage/ prefix does not rewrite every path below it"; rc=1; }
          grep -qi '^authorization: bearer ci-probe-token' /tmp/upstream-usage-query.txt \
            || { echo "::error::POST /api/usage/query lost its Authorization header — the strip belongs on /api/usage/events only, and eagle-analytics authorizes the reporting screens on that bearer"; rc=1; }
          echo "  POST /api/usage/query -> gateway upstream saw: $(head -1 /tmp/upstream-usage-query.txt | tr -d '\r')"

          # Worker cap: `auto` means one worker per node core (32 on silver), which OOMs, and nginx -t and
          # helm lint stay green if it returns.
          workers=$(docker exec authcheck ps -o args | grep -c 'nginx: worker process' || true)
          [ "$workers" = 2 ] || { echo "::error::nginx.conf must keep worker_processes 2, saw $workers workers"; rc=1; }
          echo "  nginx workers: $workers"

          docker logs authcheck 2>&1 | tail -5
          docker rm -f authcheck >/dev/null
          exit $rc

      # Checks the chart against the template of every tag at or above MIN_TAG, not just this commit's:
      # an unset variable stays literal and nginx will not start. The nginx -t step sets its own env.
      - name: Chart supplies every variable released templates expand
        run: |
          set -euo pipefail
          git fetch --tags --quiet --force
          # Every name must be present and every NGINX__*PROXY__* upstream non-empty (`proxy_pass ;` is
          # [emerg]; empty HTTP_BASIC* means no auth). Envs render apart so an error names its file.
          ENVS="dev test prod"
          for e in $ENVS; do
            : > "/tmp/chart-env.$e.txt"; : > "/tmp/chart-nonempty.$e.txt"
            helm template rproxy ./helm/rproxy -f "helm/rproxy/values-$e.yaml" \
              | awk -v env="$e" '/^[[:space:]]+- name: [A-Z_0-9]+$/ { n=$3; next }
                     n != "" {
                       if ($0 ~ /^[[:space:]]+value:/) {
                         v=$0; sub(/^[[:space:]]*value:[[:space:]]*/,"",v); gsub(/^"|"$/,"",v)
                         print n > ("/tmp/chart-env." env ".txt")
                         if (v != "") print n > ("/tmp/chart-nonempty." env ".txt")
                       }
                       n=""
                     }'
            sort -u -o "/tmp/chart-env.$e.txt" "/tmp/chart-env.$e.txt"
            sort -u -o "/tmp/chart-nonempty.$e.txt" "/tmp/chart-nonempty.$e.txt"
          done
          rc=0
          # Every tag at or above MIN_TAG. v2.7.6 expands the Typesense variable and that service is
          # gone, so it is not a deployable target.
          MIN_TAG=v2.7.7
          checked=0
          # Working tree first: tags alone catch a variable removed from the chart, not one added to the
          # template without deployment.yaml.
          for tag in WORKING_TREE $(git for-each-ref --format='%(refname:short)' refs/tags \
                        | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V \
                        | awk -v min="$MIN_TAG" 'min=="" || $0==min {p=1} p'); do
            if [ "$tag" = WORKING_TREE ]; then
              cat conf.d/server.conf.tmpl
            else
              git show "$tag:conf.d/server.conf.tmpl" 2>/dev/null
            fi | grep -o '\${[A-Z_0-9]*}' | tr -d '${}' | sort -u > /tmp/tag-vars.txt || continue
            bad=0
            for e in $ENVS; do
              missing=$(comm -23 /tmp/tag-vars.txt "/tmp/chart-env.$e.txt" | tr '\n' ' ')
              # An upstream the chart renders as "" is as fatal as one it omits entirely.
              blank=$(grep -E 'PROXY__' /tmp/tag-vars.txt | sort -u \
                       | comm -23 - "/tmp/chart-nonempty.$e.txt" | tr '\n' ' ')
              [ -n "$missing" ] && echo "::error::values-$e.yaml does not supply, for image tag $tag: $missing" && bad=1
              [ -n "$blank" ] && echo "::error::values-$e.yaml renders an EMPTY upstream, for image tag $tag: $blank" && bad=1
            done
            if [ "$bad" = 1 ]; then rc=1; else echo "  $tag OK"; fi
            # WORKING_TREE deliberately does NOT count. It is present on every run, so counting it
            # would make the floor check below unreachable and silently revert it.
            [ "$tag" = WORKING_TREE ] || checked=$((checked + 1))
          done
          # A floor that matches nothing checks nothing and exits 0; fail loudly if MIN_TAG is deleted,
          # retagged or mistyped.
          if [ "$checked" -eq 0 ]; then
            echo "::error::no RELEASED tags at or above MIN_TAG=$MIN_TAG were examined — the guard checked only the working tree"
            exit 1
          fi
          echo "  checked $checked tag(s) from $MIN_TAG up"
          exit $rc

      - name: Validate Helm chart
        run: |
          if [ ! -f helm/rproxy/Chart.yaml ]; then
            echo "Error: helm/rproxy/Chart.yaml not found"
            exit 1
          fi
          
          if [ ! -f helm/rproxy/values.yaml ]; then
            echo "Error: helm/rproxy/values.yaml not found"
            exit 1
          fi
          
          helm lint helm/rproxy
          
          echo "✓ Helm chart validation passed"

      - name: Validate Dockerfile
        run: |
          if [ ! -f Dockerfile ]; then
            echo "Error: Dockerfile not found"
            exit 1
          fi
          
          if ! grep -q "FROM nginx:1.27-alpine" Dockerfile; then
            echo "Error: Dockerfile must use nginx:1.27-alpine base image"
            exit 1
          fi
          
          if ! grep -q "EXPOSE 8080" Dockerfile; then
            echo "Error: Dockerfile must expose port 8080"
            exit 1
          fi
          
          echo "✓ Dockerfile validation passed"
